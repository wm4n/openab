# openab-claude release：Rick + Morty（Claude 家族，維持預設 seccomp RuntimeDefault）
#
# 用法：
#   helm install openab-claude oci://ghcr.io/openabdev/charts/openab --version 0.9.0-beta.1 -n cac \
#     -f values-openab-claude.yaml -f values-secret-claude.yaml
#
# ⚠️ 務必帶 --version（目前釘住 0.9.0-beta.1，見 `helm history openab-claude -n cac`
#    確認的線上實際版本）：不指定版本會抓 OCI registry 當下的預設 tag，
#    2026-08-24 實測不指定會拉到較新的 0.9.0，其 configmap.yaml 對
#    agents.genie 的舊式結構化欄位（discord.*/pool.* 等）設了硬性擋板
#    （要求遷移到 configToml/configUrl），導致整個 upgrade 失敗（Rick/
#    Morty/Genie 共用一個 release，genie 沒過就全部卡住）。升級版本前
#    先完成 genie 的 configToml 遷移，再拿掉這個釘版本。
# ⚠️ Discord token 由 -f values-secret-claude.yaml 疊加，不要寫在這裡。
# ⚠️ 所有雪花 ID（channel/user/role/bot）一律用字串（引號）；chart 對浮點精度損毀有防呆會 fail。
# 頻道：cac-dev-team(1528965074562191420)、cac-notify(1528965173761802420)，兩個都要回應。
# allowedUsers 留空 = 允許頻道內任何人 @（共用團隊頻道，不限定單一使用者）。
# 角色（Part M，CAC k3s 專用，與舊 Mac mini 部署的 Builder/Reviewer ID 不同）：
#   CAC-Analyst=1528997714879320134　CAC-Builder=1528997914049777764　CAC-Reviewer=1528997980714303640

image:
  repository: ghcr.io/openabdev/openab-claude

agents:
  # chart 內建一個預設範例 agent "kiro"（enabled: true）；我們沒用到，必須明確關閉，
  # 否則會被 Helm 一起合併進來、多裝出一個沒設定好的 kiro-cli pod。
  kiro:
    enabled: false

  rick:
    image: "ghcr.io/104corp/openab:0.9.0-claude-cli2.1.220"
    imagePullSecrets:
      - name: ghcr-104corp
    command: claude-agent-acp
    args: []
    workingDir: /home/node # HOME 跟著它；PVC 掛在此
    # openspec 裝在 PVC（npm prefix=/home/node/.npm-global，避開唯讀根碟）；
    # PATH 加在最前面，讓 agent 與其 subprocess 都找得到 openspec 指令。
    # HANDOFF_* 給 feature-development skill 用：@mention 目標改用環境變數，
    # 換 workspace 只要改這裡的值，不用動 skill 內容（bot user ID，同下方 trustedBotIds）。
    env:
      PATH: "/home/node/.npm-global/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      HANDOFF_REVIEWER_MORTY: "<@1521431781641818202>"
      HANDOFF_REVIEWER_SUMMER: "<@1522253638465093752>"
    discord:
      enabled: true
      allowedChannels: ["1528965074562191420", "1528965173761802420", "1522271475552354394", "1526283579309690990"] # cac-dev-team, cac-notify, dev-bot(william workspace), bot-notify(william workspace)
      allowedUsers: ["824092654060830770"] # 空=允許頻道內任何人
      allowBotMessages: "mentions" # bot 互呼（Part K）
      # jira-grill-poller（K8s CronJob，見 deployment-guides/k3s/jira-grill-poller/）
      # 判斷需要處理某張票時，用這個 bot 帳號 @mention Rick 觸發，取代舊的
      # cron 輪詢機制。
      trustedBotIds: ["1521431781641818202", "1522253638465093752", "1541617131442147438"] # Morty, Summer, jira-grill-trigger
      allowedRoleIds: ["1528997914049777764"] # CAC-Builder（Part M）
    # Rick 的 JIRA 認證（jira-grill skill 用）：複用既有 morty-jira K8s
    # Secret，不新建。secretEnv 會 valueFrom.secretKeyRef 注入，並自動把
    # 這些 key 加進 config 的 inherit_env。
    secretEnv:
      - { name: JIRA_TOKEN, secretName: morty-jira, secretKey: JIRA_TOKEN }
      - {
          name: JIRA_BASE_URL,
          secretName: morty-jira,
          secretKey: JIRA_BASE_URL,
        }
      - { name: JIRA_EMAIL, secretName: morty-jira, secretKey: JIRA_EMAIL }
    # usercron：cronjob.toml 熱重載排程（openab-schedule skill 用）；
    # 路徑相對 $HOME/.openab/，落在下面的 PVC 上，pod 重啟不會丟。
    cron:
      usercronEnabled: true
      usercronPath: "cronjob.toml"
    pool:
      maxSessions: 5
      sessionTtlHours: 24
      # 單輪 prompt 可能跑很久；預設 1800s 撞過(Agent exceeded hard timeout)，拉到 4hr。
      promptHardTimeoutSecs: 14400
    reactions:
      toolDisplay: "compact"
    persistence:
      enabled: true
      storageClass: cac-local # 靜態 PV，落在 /data（NFS，跟 mis-ai 同一顆碟），不進根碟 local-path
      size: 30Gi

  morty:
    image: "ghcr.io/104corp/openab:0.9.0-claude-cli2.1.220"
    imagePullSecrets:
      - name: ghcr-104corp
    command: claude-agent-acp
    args: []
    workingDir: /home/node
    # HANDOFF_BUILDER 給 requirement-analysis/change-review skill 用：@mention Rick
    # 改用環境變數，換 workspace 只要改這裡的值（bot user ID，同下方 trustedBotIds）。
    env:
      HANDOFF_BUILDER: "<@1519868630064562278>"
    discord:
      enabled: true
      allowedChannels: ["1528965074562191420", "1528965173761802420", "1522271475552354394", "1526283579309690990"] # follow Rick
      allowedUsers: ["824092654060830770"] # 空=允許頻道內任何人
      allowBotMessages: "mentions"
      trustedBotIds: ["1519868630064562278", "1522253638465093752"] # Rick, Summer
      allowedRoleIds: ["1528997714879320134", "1528997980714303640"] # CAC-Analyst, CAC-Reviewer（Part M）
    # Morty 的 JIRA 憑證：先在 VM 上 kubectl create secret generic morty-jira（見 K3S.md）。
    # secretEnv 會 valueFrom.secretKeyRef 注入，並自動把這些 key 加進 config 的 inherit_env。
    secretEnv:
      - { name: JIRA_TOKEN, secretName: morty-jira, secretKey: JIRA_TOKEN }
      - {
          name: JIRA_BASE_URL,
          secretName: morty-jira,
          secretKey: JIRA_BASE_URL,
        }
      - { name: JIRA_EMAIL, secretName: morty-jira, secretKey: JIRA_EMAIL }
    # usercron：cronjob.toml 熱重載排程（openab-schedule skill 用）；
    # 路徑相對 $HOME/.openab/，落在下面的 PVC 上，pod 重啟不會丟。
    cron:
      usercronEnabled: true
      usercronPath: "cronjob.toml"
    pool:
      maxSessions: 5
      sessionTtlHours: 24
      # 單輪 prompt 可能跑很久；預設 1800s 撞過(Agent exceeded hard timeout)，拉到 4hr。
      promptHardTimeoutSecs: 14400
    reactions:
      toolDisplay: "compact"
    persistence:
      enabled: true
      storageClass: cac-local # 靜態 PV，落在 /data（NFS，跟 mis-ai 同一顆碟），不進根碟 local-path
      size: 30Gi

  genie:
    image: "ghcr.io/104corp/openab:0.9.0-claude-cli2.1.220"
    imagePullSecrets:
      - name: ghcr-104corp
    command: claude-agent-acp
    args: []
    workingDir: /home/node
    # openspec 裝在 PVC（npm prefix=/home/node/.npm-global，避開唯讀根碟）；
    # PATH 加在最前面，讓 agent 與其 subprocess 都找得到 openspec 指令。
    # mise 的 bin/shims 也裝在 PVC（~/.local/bin、~/.local/share/mise/shims），
    # 同樣避開唯讀根碟；shims 模式讓 Genie 每次全新的 Bash 呼叫都能靠當下
    # repo 的 .mise.toml/.tool-versions 自動切換 runtime 版本，不需要
    # shell activate hook（Genie 每次工具呼叫都是全新 process，hook 不會
    # 生效）。詳見 deployment-guides/k3s/genie-mise-setup.md。
    # ⚠️ shims 目錄要排在 .local/bin 前面：.local/bin 底下還有 uv（既有、
    # 跟 mise 無關）建的 python symlink，2026-08-25 實測順序反了會被 uv
    # 的版本蓋掉，mise 管的版本切換整套失效。
    # Android SDK（mise plugin android-sdk）跟 Flutter/Python 不一樣：
    # 版本切換粒度在 sdkmanager 那層（裝哪些 platforms;android-XX/
    # build-tools;XX，多版本並存），不是靠 mise 切整個 SDK，所以
    # platform-tools 直接寫死進 PATH、ANDROID_HOME 指向 mise 管理的
    # SDK 安裝路徑（含 mise plugin 版本號 23.0，之後升級這個 plugin
    # 版本要記得同步改這裡）。
    # ⚠️ 2026-08-25 拿真的 104cac-M104-android-v2 repo 實測踩過：LANG/
    # LC_ALL 完全沒設，image 只有 C/C.utf8/POSIX 三個 locale（唯讀根碟
    # 裝不了新的），非 ASCII（中文）檔名會被 Gradle/Java 讀成亂碼導致
    # 任務失敗（Jenkinsfile 自己也特地設了 LANG=zh_TW.UTF-8，可見這個
    # repo 真的有非 ASCII 檔名）。設 C.utf8 就解決，不需要真的裝中文
    # locale——只是要 UTF-8 位元組處理，不需要翻譯/排序規則。
    env:
      PATH: "/home/node/.npm-global/bin:/home/node/.local/share/mise/shims:/home/node/.local/bin:/home/node/.local/share/mise/installs/android-sdk/23.0/platform-tools:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      LANG: "C.utf8"
      LC_ALL: "C.utf8"
      ANDROID_HOME: "/home/node/.local/share/mise/installs/android-sdk/23.0"
      ANDROID_SDK_ROOT: "/home/node/.local/share/mise/installs/android-sdk/23.0"
      # 2026-09-01 新增：某些 PHP repo 不用 mise 宣告環境，改用 Dockerfile/Makefile。
      # 讓 genie 主 container 的 docker CLI 指向下面 extraContainers 那個 dind
      # sidecar（同 pod、走 localhost，關掉 TLS 因為流量不出這個 pod）。
      DOCKER_HOST: "tcp://localhost:2375"
    discord:
      enabled: true
      allowedChannels: ["1528965074562191420", "1528965173761802420"] # cac-dev-team, cac-notify
      allowedUsers: []
      allowBotMessages: "mentions"
      trustedBotIds:
        [
          "1521431781641818202",
          "1519868630064562278",
          "1522253638465093752",
          "1541617131442147438",
        ] # Morty, Rick, Summer, jira-grill-trigger
    secretEnv:
      - { name: JIRA_TOKEN, secretName: morty-jira, secretKey: JIRA_TOKEN }
      - {
          name: JIRA_BASE_URL,
          secretName: morty-jira,
          secretKey: JIRA_BASE_URL,
        }
      - { name: JIRA_EMAIL, secretName: morty-jira, secretKey: JIRA_EMAIL }
    cron:
      usercronEnabled: true
      usercronPath: "cronjob.toml"
    pool:
      maxSessions: 5
      sessionTtlHours: 24
      # solo-feature-pipeline 一路 openspec new→ff→apply→review→archive→PR 不中途停，
      # 單輪 prompt 可能跑很久；預設 1800s 撞過(Agent exceeded hard timeout)，拉到 4hr。
      promptHardTimeoutSecs: 14400
    reactions:
      toolDisplay: "compact"
    persistence:
      enabled: true
      storageClass: cac-local # 靜態 PV，落在 /data（NFS，跟 mis-ai 同一顆碟），不進根碟 local-path
      size: 60Gi
    # 2026-09-01 新增：docker-in-docker sidecar，只給 genie 用（不動 Rick/Morty）。
    # privileged 只在這個 container 生效，不影響 pod 層級的 podSecurityContext
    # （那個是 release 全域，Rick/Morty 仍維持 RuntimeDefault、非 privileged）。
    extraContainers:
      - name: dind
        image: docker:27-dind
        securityContext:
          privileged: true
        env:
          - name: DOCKER_TLS_CERTDIR
            value: "" # 同 pod 內部流量、不出網路，關掉 TLS
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: "2"
            memory: 3Gi
        volumeMounts:
          # 跟主 container 掛同一顆 PVC、同一個路徑，docker run -v $(CURDIR):...
          # 這種 bind mount 才能在 dind daemon 裡解到正確路徑。
          - name: data
            mountPath: /home/node
          - name: docker-data
            mountPath: /var/lib/docker
    extraVolumes:
      # image cache 用 emptyDir，不用另外申請靜態 PV；代價是 pod 重啟後
      # image 要重新拉一次（分鐘等級，可接受）。
      - name: docker-data
        emptyDir:
          sizeLimit: 20Gi
