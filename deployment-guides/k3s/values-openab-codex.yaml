# openab-codex release：Summer（Codex 家族）
#
# 用法：
#   helm install openab-codex oci://ghcr.io/openabdev/charts/openab -n cac \
#     -f values-openab-codex.yaml -f values-secret-codex.yaml
#
# ⚠️ seccomp 放寬到 Unconfined，讓 codex-acp 內部 bwrap 能建 user namespace（openab issue #1047）。
#    chart 的 podSecurityContext 是 chart-global，此處覆蓋會套用到本 release 所有 agent（目前只有 Summer）。
#    這也是為什麼 Summer 要獨立成一個 release、不和 Rick/Morty 混（那兩隻維持 RuntimeDefault）。
# ⚠️ Discord token 由 -f values-secret-codex.yaml 疊加，不要寫在這裡。

image:
  repository: ghcr.io/openabdev/openab-codex

# 覆蓋 chart-global podSecurityContext：唯一差異是 seccompProfile 改 Unconfined。
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: Unconfined

agents:
  # chart 內建一個預設範例 agent "kiro"（enabled: true）；我們沒用到，必須明確關閉，
  # 否則會被 Helm 一起合併進來、多裝出一個沒設定好的 kiro-cli pod。
  kiro:
    enabled: false

  summer:
    command: codex-acp
    args: ["-c", "shell_environment_policy.inherit=all"]
    workingDir: /home/node
    discord:
      enabled: true
      allowedChannels: ["1528965074562191420", "1528965173761802420"] # cac-dev-team, cac-notify
      allowedUsers: []                                               # 空=允許頻道內任何人
      allowBotMessages: "mentions"
      trustedBotIds: ["1519868630064562278", "1521431781641818202"] # Rick, Morty
      allowedRoleIds: ["1528997980714303640"]                        # CAC-Reviewer（Part M）
    pool:
      maxSessions: 5
      sessionTtlHours: 24
    persistence:
      enabled: true
      storageClass: cac-local   # 靜態 PV，落在 /data（NFS，跟 mis-ai 同一顆碟），不進根碟 local-path
      size: 30Gi
    # Codex 內部 ~/.codex/config.toml（issue #1047 三 key：sandbox_mode / approvals_reviewer /
    # multi_agent）不在此 values——由 bootstrap 寫進 PVC（見 K3S.md）。
