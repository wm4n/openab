# 複製成 values-secret-kimi.yaml（已被 .gitignore，永不 commit）填入真實值。
# 此檔供 Kimi bot（opencode 後端）使用 —— 併進 openab-claude release 或獨立 release 都用這份疊加。
#
# 只放 Discord token。OpenRouter API key 不放這裡：
#   - 預設走 bootstrap `opencode auth login`（存進 PVC 的 auth.json）
#   - 若改用宣告式注入，另建 K8s Secret openab-kimi-openrouter（見 values-openab-kimi.yaml 方式 2）
agents:
  kimi:
    discord:
      botToken: "<KIMI_DISCORD_BOT_TOKEN>"
