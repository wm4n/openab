# openab Kimi bot（opencode 後端 + OpenRouter，模型 moonshotai/kimi-k2.7-code）
#
# 這是一份「加一顆 agent」的 values overlay（只含 agents.kimi 區塊），兩種用法擇一：
#
# (A) 併進既有 openab-claude release（推薦，照 K3S.md「未來加 agent」流程）
#     —— opencode 只需 RuntimeDefault seccomp，與 Rick/Morty 同 release 無虞：
#
#   helm upgrade openab-claude ../../charts/openab -n cac \
#     -f values-openab-claude.yaml   -f values-secret-claude.yaml \
#     -f values-openab-kimi.yaml     -f values-secret-kimi.yaml
#
# (B) 獨立 release：
#
#   helm install openab-kimi oci://ghcr.io/openabdev/charts/openab --version <deployed 版本> -n cac \
#     -f values-openab-kimi.yaml -f values-secret-kimi.yaml
#
# ⚠️ 用 (B) 或走 OCI 時務必帶 --version：先 `helm history <release> -n cac` 看 `deployed`
#    那筆的 CHART 版本再帶入。不指定會抓 registry 當下預設 tag，可能拉到較新、
#    有 breaking change 的 chart（詳見 values-openab-codex.yaml 開頭的說明）。
# ⚠️ 不要在這裡設 top-level `image:` —— 併進 openab-claude release 時會蓋掉
#    Rick/Morty 的映像。只用 agents.kimi.image。
# ⚠️ Discord token 由 -f values-secret-kimi.yaml 疊加，不要寫在這裡。

agents:
  # 併進既有 release：這行與 -f values-openab-claude.yaml 疊加，不影響 Rick/Morty。
  # 獨立 release：chart 內建的 kiro 範例 agent 必須明確關掉，否則會多裝一顆。
  kiro:
    enabled: false

  kimi:
    image: ghcr.io/openabdev/openab-opencode:latest   # tag 省略會自動補 appVersion；此處釘 latest
    command: opencode
    args: ["acp"]
    workingDir: /home/node

    discord:
      enabled: true
      # ⚠️ channel ID 用字串引號（或 helm --set-string），避免 float64 精度掉位
      allowedChannels: ["<KIMI_CHANNEL_ID>"]
      allowedUsers: []                # 空 = 頻道內任何人；要鎖就填 user ID
      allowBotMessages: "mentions"
      trustedBotIds: []
      allowedRoleIds: []              # 要團隊 @mention 觸發再填角色 ID（Part M）

    # --- OpenRouter API key：兩種給法擇一 ---
    #
    # 方式 1（預設，較安全）：不在 values 設，改用 bootstrap `opencode auth login`
    #   把 key 存進 PVC 的 ~/.local/share/opencode/auth.json —— agent 進程讀不到
    #   裸 key。步驟見 bot-setup-opencode-kimi.md「附錄 A — k3s」。
    #
    # 方式 2（宣告式 / GitOps）：secretEnv 從 K8s Secret 注入 OPENROUTER_API_KEY，
    #   opencode / AI SDK 會自動讀。缺點：chart 會把它併進 inherit_env，agent
    #   拿得到裸 key，可能被 prompt injection 騙出。要用先建 Secret：
    #     kubectl -n cac create secret generic openab-kimi-openrouter \
    #       --from-literal=OPENROUTER_API_KEY=sk-or-v1-xxxx
    #   再取消下面註解：
    # secretEnv:
    #   - name: OPENROUTER_API_KEY
    #     secretName: openab-kimi-openrouter
    #     secretKey: OPENROUTER_API_KEY

    inheritEnv: ["GH_TOKEN"]          # GitHub 用；OpenRouter key 不放這

    # ⚠️ 不設 agentsMd —— context 檔（/home/node/AGENTS.md）跟 Rick/Morty/Summer/Genie
    #    一樣由 update-context.sh 寫進 PVC（來源 deployment-guides/Kimi-AGENTS_v2.md）。
    #    設了 agentsMd 會掛成唯讀 ConfigMap，update-context.sh 的 `cat > AGENTS.md`
    #    會 Read-only file system 而 set -e 中止。opencode.json 同理由 bootstrap 寫 PVC。

    cron:
      usercronEnabled: true
      usercronPath: "cronjob.toml"

    pool:
      maxSessions: 3
      sessionTtlHours: 24

    persistence:
      enabled: true
      storageClass: cac-local        # 靜態 PV（NFS，見 K3S.md Phase A）。留空會退回叢集 default（k3s 內建 local-path，落根碟）
      size: 20Gi
